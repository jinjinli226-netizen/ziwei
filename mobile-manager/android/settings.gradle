pluginManagement {
    repositories { google(); mavenCentral(); gradlePluginPortal(); maven { url 'https://developer.huawei.com/repo/' } }
    resolutionStrategy { eachPlugin { if (requested.id.id == 'com.huawei.agconnect') useModule('com.huawei.agconnect:agcp:1.9.1.301') } }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories { google(); mavenCentral(); maven { url 'https://developer.huawei.com/repo/' } }
}
rootProject.name = 'ZiweiManagerSystemPush'
